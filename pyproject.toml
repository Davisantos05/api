[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-control-plane"
version = "0.6.0"
description = "Control plane for operations requested by AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
nexus-create-admin = "nexus.cli.create_admin:main"
nexus-seed = "nexus.cli.seed:main"
nexus-seed-dashboard = "nexus.cli.seed_dashboard:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
    "ruff>=0.9,<1",
    "pyright>=1.1,<2",
]
browser = ["playwright>=1.48,<2"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/assets/*.png"]
